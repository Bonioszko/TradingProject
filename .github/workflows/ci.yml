name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PaperTrade.sln

      - name: Verify formatting
        run: dotnet format PaperTrade.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PaperTrade.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PaperTrade.sln --configuration Release --no-build --logger trx --results-directory TestResults
